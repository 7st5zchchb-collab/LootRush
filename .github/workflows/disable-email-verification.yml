name: Apply LootRush auth fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  disable-email-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Update server auth
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'server.js';
            const ref = 'main';

            const file = await github.rest.repos.getContent({ owner, repo, path, ref });
            const sha = file.data.sha;
            let source = Buffer.from(file.data.content, 'base64').toString('utf8');

            const registerStart = source.indexOf('app.post("/register"');
            const verifyStart = source.indexOf('app.get("/verify-email"', registerStart);
            if (registerStart === -1 || verifyStart === -1) {
              core.setFailed('Could not locate the registration route in server.js');
              return;
            }

            const registerRoute = `app.post("/register",async(req,res)=>{if(!requireDatabase(res)||!requireSessionSecret(res))return;try{const username=String(req.body.username||"").trim(),email=String(req.body.email||"").trim().toLowerCase(),password=String(req.body.password||"");if(username.length<3||!email.includes("@")||password.length<6)return res.status(400).json({error:"Username, valid email and 6+ character password required."});const hash=await hashPassword(password);const r=await pool.query("INSERT INTO users (username,email,password_hash) VALUES ($1,$2,$3) RETURNING id,username,email,coins,diamonds,points",[username,email,hash]);res.json({success:true,user:r.rows[0]})}catch(err){if(err.code==="23505")return res.status(409).json({error:"Email already registered."});res.status(500).json({error:"Registration failed."})}});\n`;
            source = source.slice(0, registerStart) + registerRoute + source.slice(verifyStart);

            const loginStart = source.indexOf('app.post("/login"');
            const meStart = source.indexOf('app.get("/me"', loginStart);
            if (loginStart === -1 || meStart === -1) {
              core.setFailed('Could not locate the login route in server.js');
              return;
            }

            const loginRoute = `app.post("/login",async(req,res)=>{if(!requireDatabase(res)||!requireSessionSecret(res))return;try{const username=String(req.body.username||"").trim(),password=String(req.body.password||""),r=await pool.query("SELECT * FROM users WHERE username=$1",[username]);if(r.rowCount!==1||!(await verifyPassword(password,r.rows[0].password_hash)))return res.status(401).json({error:"Wrong username or password."});const u=r.rows[0];res.json({success:true,token:signToken(u.id),user:{id:u.id,username:u.username,email:u.email,coins:u.coins,diamonds:u.diamonds,points:u.points}})}catch(err){res.status(500).json({error:"Login failed."})}});\n`;
            source = source.slice(0, loginStart) + loginRoute + source.slice(meStart);

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'Disable email verification for now',
              content: Buffer.from(source, 'utf8').toString('base64'),
              sha,
              branch: ref
            });

            await github.rest.issues.update({ owner, repo, issue_number: context.issue.number, state: 'closed' });
