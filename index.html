<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LootRush - Խաղա և Հաղթիր</title>
    <!-- Միացնում ենք CSS ոճերը -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ԱՎՏՈՐԻԶԱՑԻԱՅԻ ՊԱՏՈՒՀԱՆ (LOGIN / REGISTER) -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-box">
            
            <!-- ՄՈՒՏՔԻ ԲԱԺԻՆ (LOGIN) -->
            <div id="loginForm">
                <h2>Welcome to <span>LootRush</span></h2>
                <p class="auth-subtitle">Sign in to your account to continue</p>
                
                <div class="input-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email">
                </div>
                
                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                </div>
                
                <!-- Սեղմելիս կանչվում է handleLogin()-ը game.js-ից -->
                <button class="auth-btn" onclick="handleLogin()">🚪 Sign In</button>
                
                <p class="auth-switch">
                    Don't have an account? <a href="#" onclick="switchAuthForm('register')">Register here</a>
                </p>
            </div>

            <!-- ԳՐԱՆՑՄԱՆ ԲԱԺԻՆ (REGISTER) -->
            <div id="registerForm" class="hidden">
                <h2>Create Account</h2>
                <p class="auth-subtitle">Join LootRush and start winning rewards</p>
                
                <div class="input-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" placeholder="Enter username">
                </div>
                
                <div class="input-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" placeholder="Enter email">
                </div>
                
                <div class="input-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="Password (min. 6 characters)">
                </div>
                
                <!-- Սեղմելիս կանչվում է handleRegister()-ը game.js-ից -->
                <button class="auth-btn" onclick="handleRegister()">📝 Register</button>
                
                <p class="auth-switch">
                    Already have an account? <a href="#" onclick="switchAuthForm('login')">Sign in here</a>
                </p>
            </div>

        </div>
    </div>

    <!-- ԽԱՂԻ ԳԼԽԱՎՈՐ ԻՆՏԵՐՖԵՅՍԸ (Մուտք գործելուց հետո) -->
    <header>
        <h2><span>LootRush</span></h2>
        <nav>
            <button onclick="showPage('game')">🎲 Game</button>
            <button onclick="showPage('shop')">🛒 Shop</button>
            <button onclick="showPage('inventory')">🎒 Inventory</button>
            <button onclick="showPage('rewards')">🎁 Rewards</button>
            <button onclick="showPage('bomber')">💣 Bomber</button>
            <button onclick="showPage('crash')">📈 Multiplier</button>
            <button onclick="showPage('wallet')">💳 Wallet</button>
        </nav>
        
        <div class="header-right-side">
            <div class="currency-box">
                <div class="currency coins">💵 <span id="coins">150</span></div>
                <div class="currency diamonds">💎 <span id="diamonds">0</span></div>
                <div class="currency points">⭐ <span id="points">0</span></div>
            </div>
            <div class="player-menu">
                <button class="player-avatar" onclick="togglePlayerMenu()">
                    <img id="playerAvatar" src="default-avatar.png" alt="Avatar">
                </button>
                <div id="profileDropdown" class="profile-dropdown">
                    <div class="profile-name" id="playerNameTop">Guest</div>
                    <button class="profile-option" onclick="logout()">🚪 Log Out</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Ծանուցումների պատուհան (showMessage ֆունկցիայի համար) -->
    <div id="message"></div>

    <!-- ԿԱՐԵՎՈՐ. JavaScript-ը միացնում ենք ԷՋԻ ԱՄԵՆԱՎԵՐՋՈՒՄ -->
    <script src="game.js"></script>
</body>
</html>
