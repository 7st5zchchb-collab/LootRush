<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LootRush - Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background"><div class="grid"></div><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>

  <div class="register-wrapper">
    <div class="register-card">
      <div class="logo"><h1>Loot<span>Rush</span></h1><p>Create your account and start your journey</p></div>

      <form id="registerForm">
        <div class="input-group"><label for="username">Username</label><div class="input-box"><span class="input-icon"></span><input type="text" id="username" placeholder="Enter your username" autocomplete="username" required></div></div>
        <div class="input-group"><label for="email">Email</label><div class="input-box"><span class="input-icon"></span><input type="email" id="email" placeholder="Enter your email" autocomplete="email" required></div></div>
        <div class="input-group"><label for="password">Password</label><div class="input-box"><span class="input-icon"></span><input type="password" id="password" placeholder="Create a password" autocomplete="new-password" minlength="6" required></div><p class="password-hint">Password must contain at least 6 characters.</p></div>
        <div class="input-group"><label for="confirmPassword">Confirm Password</label><div class="input-box"><span class="input-icon"></span><input type="password" id="confirmPassword" placeholder="Repeat your password" autocomplete="new-password" minlength="6" required></div></div>
        <label class="terms"><input type="checkbox" id="terms" required><span>I agree to the <a href="#" onclick="return false;">Terms of Service</a> and <a href="#" onclick="return false;">Privacy Policy</a>.</span></label>
        <button type="submit" class="register-button">🚀 Create Account</button>
      </form>

      <div class="login-text">Already have an account? <a href="login.html">Login</a></div>
    </div>
  </div>

  <div id="message"></div>

  <script>
    const LOOTRUSH_SERVER = "https://lootrush-2.onrender.com";
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    function showMessage(text) {
      message.textContent = text;
      message.classList.add("show");
      clearTimeout(window.__messageTimer);
      window.__messageTimer = setTimeout(() => message.classList.remove("show"), 5000);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (username.length < 3) return showMessage("❌ Username must be at least 3 characters!");
      if (password.length < 6) return showMessage("❌ Password must be at least 6 characters!");
      if (password !== confirmPassword) return showMessage("❌ Passwords do not match!");
      if (!document.getElementById("terms").checked) return showMessage("❌ Please accept the Terms!");

      try {
        showMessage("⏳ Creating account...");
        const response = await fetch(`${LOOTRUSH_SERVER}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Registration failed.");

        // Keep the credentials only for this Register -> Login handoff.
        // They are removed immediately after the next login attempt.
        sessionStorage.setItem("lootRushPendingUsername", username);
        sessionStorage.setItem("lootRushPendingPassword", password);
        sessionStorage.setItem("lootRushPendingEmail", email);

        showMessage("✅ Account created! Opening Login...");
        setTimeout(() => { window.location.href = "login.html"; }, 700);
      } catch (error) {
        console.error(error);
        showMessage(`❌ ${error.message || "Registration failed."}`);
      }
    });
  </script>
</body>
</html>
